<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>DICOM Conformance Statements</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    h1 { margin-bottom: 20px; }
    ul { line-height: 1.8; }
  </style>
</head>
<body>

<h1>DICOM Conformance Statements</h1>
<p>Files in this directory:</p>

<ul id="file-list"></ul>

<script>
  async function loadFiles() {
    const response = await fetch(window.location.href);
    const text = await response.text();

    // Parse directory listing (GitHub Pages auto-generated HTML)
    const parser = new DOMParser();
    const doc = parser.parseFromString(text, "text/html");

    const links = [...doc.querySelectorAll("a")];

    const pdfs = links
      .map(a => a.getAttribute("href"))
      .filter(href => href && href.endsWith(".pdf"));

    const list = document.getElementById("file-list");

    pdfs.forEach(pdf => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = pdf;
      a.textContent = pdf.replace(/\.pdf$/, "");
      li.appendChild(a);
      list.appendChild(li);
    });
  }

  loadFiles();
</script>

</body>
</html>
