<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Agfa DICOM Conformance Statements</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    h1 { margin-bottom: 20px; }
    ul { line-height: 1.8; }
  </style>
</head>
<body>

<h1>Agfa DICOM Conformance Statements</h1>
<p>Files in this directory:</p>

<ul id="file-list"></ul>

<script>
  async function loadFiles() {
    // GitHub API URL for this folder
    const apiUrl = "https://api.github.com/repos/PACS-HEALTH/pacs.health/contents/docs/dicom/Agfa";

    const response = await fetch(apiUrl);
    const files = await response.json();

    const list = document.getElementById("file-list");

    files
      .filter(file => file.name.endsWith(".pdf"))
      .forEach(file => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = file.download_url;
        a.textContent = file.name.replace(".pdf", "");
        li.appendChild(a);
        list.appendChild(li);
      });
  }

  loadFiles();
</script>

</body>
</html>
